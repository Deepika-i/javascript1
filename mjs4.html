<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

let rows = 5;

// Pattern 1: Right-angled triangle of stars
console.log("Pattern 1: Star Triangle");

for (let i = 1; i <= rows; i++) {
    let pattern = "";

    for (let j = 1; j <= i; j++) {
        pattern += "* ";
    }

    console.log(pattern);
}


// Pattern 2: Inverted triangle of numbers
console.log("Pattern 2: Inverted Number Triangle");

for (let i = rows; i >= 1; i--) {
    let pattern = "";

    for (let j = 1; j <= i; j++) {
        pattern += j + " ";
    }

    console.log(pattern);
}


// Pattern 3: Pyramid of stars
console.log("Pattern 3: Star Pyramid");

for (let i = 1; i <= rows; i++) {
    let pattern = "";

    // Print spaces
    for (let j = 1; j <= rows - i; j++) {
        pattern += " ";
    }

    // Print stars
    for (let k = 1; k <= (2 * i - 1); k++) {
        pattern += "*";
    }

    console.log(pattern);
}
    </script>
</body>
</html>
