<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
</head>
<body>
    <script>
     const num1 = 23;
    const num2 = 35;
    const operator = "*";

    let result;

    if (operator === "+") {
        result = num1 + num2;
    } 
    else if (operator === "-") {
        result = num1 - num2;
    } 
    else if (operator === "*") {
        result = num1 * num2;
    } 
    else if (operator === "/") {
        if (num2 === 0) {
            console.log("Cannot divide by zero.");
        } else {
            result = num1 / num2;
        }
    } 
    else if (operator === "%") {
        result = num1 % num2;
    } 
    else {
        console.log("Invalid operator.");
    }

    if (result !== undefined) {
        console.log(`${num1} ${operator} ${num2} = ${result}`);
    }
    </script>
</body>
</html>
