<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>even number</title>
</head>
<body>
    <script>
        let evenNumbers = [];
    for(let i = 1; i <= 50; i++){
        if(i % 2 === 0){
            evenNumbers.push(i);
        }
    }
    console.log(evenNumbers);
    </script>
</body>
</html>
