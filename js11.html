<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>
</head>
<body>
    <script>
    let number = 38;
    let i=1;
    while(i<=10){
        console.log(number + " x " + i + " = " + (number * i));
        i++;
    }
    </script>
</body>
</html>
