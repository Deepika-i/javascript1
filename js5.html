<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area and Perimeter of Rectangle</title>
</head>
<body>
    <script>
        let length = Number(prompt("Enter the length of the rectangle:"));
        let breadth = Number(prompt("Enter the breadth of the rectangle:"));
        let area = length * breadth;
        let perimeter = 2 * (length + breadth);
        console.log("Length of rectangle:", length);
        console.log("Breadth of rectangle:", breadth);
        console.log("Area of rectangle:", area);
        console.log("Perimeter of rectangle:", perimeter);
    </script>
</body>
</html>
